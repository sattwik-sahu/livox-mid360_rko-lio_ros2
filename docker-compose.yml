name: livox-rko

services:
  livox-driver:
    build:
      context: .
      dockerfile: docker/livox.Dockerfile
      args:
        ROS_DISTRO: ${ROS_DISTRO:-jazzy}
    image: ghcr.io/sattwik-sahu/livox-mid360_rko-lio_ros2/livox-driver:${ROS_DISTRO:-jazzy}
    container_name: livox-driver
    network_mode: host
    privileged: false
    environment:
      - ROS_DISTRO=${ROS_DISTRO:-jazzy}
      - RMW_IMPLEMENTATION=rmw_zenoh_cpp
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - HOST_IP=${HOST_IP:-192.168.1.5}
      - LIDAR_IP=${LIDAR_IP:-192.168.1.12}
    volumes:
      - ./config/livox/MID360_config.json:/ws/src/livox_ros/config/MID360_config.json:ro
    command: ros2 launch livox_ros_driver2 msg_MID360_launch.py
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ros2 topic list | grep -q livox || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  rko-lio:
    build:
      context: .
      dockerfile: docker/rko_lio.Dockerfile
      args:
        ROS_DISTRO: ${ROS_DISTRO:-jazzy}
    image: ghcr.io/sattwik-sahu/livox-mid360_rko-lio_ros2/rko-lio:${ROS_DISTRO:-jazzy}
    container_name: rko-lio
    network_mode: host
    environment:
      - ROS_DISTRO=${ROS_DISTRO:-jazzy}
      - RMW_IMPLEMENTATION=rmw_zenoh_cpp
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
    volumes:
      - ./config/rko_lio/params.yaml:/ws/config/rko_lio/params.yaml:ro
    command: ros2 launch rko_lio odometry.launch.py
    depends_on:
      livox-driver:
        condition: service_healthy
    restart: unless-stopped
