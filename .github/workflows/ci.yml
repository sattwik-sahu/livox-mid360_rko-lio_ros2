name: CI — multi-arch × multi-distro

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ros_distro: [jazzy, kilted, lyrical]
        image: [livox-driver, rko-lio]
        include:
          - image: livox-driver
            dockerfile: docker/livox.Dockerfile
            hub_suffix: driver
          - image: rko-lio
            dockerfile: docker/rko_lio.Dockerfile
            hub_suffix: rko-lio
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta (GHCR)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ matrix.ros_distro }}
          flavor: |
            latest=false

      - name: Docker meta (Docker Hub)
        id: meta_hub
        if: github.event_name != 'pull_request'
        uses: docker/metadata-action@v5
        with:
          images: sattwik21/livox-lidar
          tags: |
            type=raw,value=${{ matrix.ros_distro }}-${{ matrix.hub_suffix }}
          flavor: |
            latest=false

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ steps.meta_hub.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ROS_DISTRO=${{ matrix.ros_distro }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  compose-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker compose
        run: |
          docker compose config >/dev/null
          ROS_DISTRO=kilted docker compose config >/dev/null
          ROS_DISTRO=lyrical docker compose config >/dev/null
          echo "compose OK"

  hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/livox.Dockerfile
          failure-threshold: error
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/rko_lio.Dockerfile
          failure-threshold: error
