title: Livox LIO
description: Livox Mid360 + RKO-LIO on ROS 2 Jazzy/Kilted/Lyrical with Zenoh — Linux & macOS (arm64)
remote_theme: just-the-docs/just-the-docs
url: "https://sattwik-sahu.github.io"
baseurl: "/livox-mid360_rko-lio_ros2"
aux_links:
  "GitHub": "https://github.com/sattwik-sahu/livox-mid360_rko-lio_ros2"
  "GHCR Livox": "https://github.com/sattwik-sahu/livox-mid360_rko-lio_ros2/pkgs/container/livox-mid360_rko-lio_ros2%2Flivox-driver"
  "GHCR RKO-LIO": "https://github.com/sattwik-sahu/livox-mid360_rko-lio_ros2/pkgs/container/livox-mid360_rko-lio_ros2%2Frko-lio"

callouts:
  highlight:
    title: Highlight
    color: yellow
  important:
    title: Important
    color: blue
  new:
    title: New
    color: green
  note:
    title: Note
    color: blue
  warning:
    title: Warning
    color: red

# Theme settings
color_scheme: light
search_enabled: true
heading_anchors: true

# Mermaid diagrams
mermaid:
  version: "10.9.0"

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-include-cache
  - jekyll-feed

footer_content: "MIT License · <a href=\"https://github.com/sattwik-sahu/livox-mid360_rko-lio_ros2\">GitHub</a> · <a href=\"https://github.com/sattwik-sahu/livox-mid360_rko-lio_ros2/pkgs/container/livox-mid360_rko-lio_ros2%2Flivox-driver\">GHCR livox-driver</a> · <a href=\"https://github.com/sattwik-sahu/livox-mid360_rko-lio_ros2/pkgs/container/livox-mid360_rko-lio_ros2%2Frko-lio\">GHCR rko-lio</a>"

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
